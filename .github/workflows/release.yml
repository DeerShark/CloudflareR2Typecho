name: Release Typecho plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: true
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Package and publish plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: Validate and package plugin
        id: package
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must use semantic version format, for example 1.0.0 or 1.0.0-beta.1" >&2
            exit 1
          fi

          test -f plugin/Plugin.php
          test -f plugin/vendor/aws/aws-autoloader.php
          php -l plugin/Plugin.php

          package_root="$RUNNER_TEMP/plugin-release"
          archive="$RUNNER_TEMP/CloudflareR2Plugin-${version}.zip"
          checksum="${archive}.sha256"

          rm -rf "$package_root"
          mkdir -p "$package_root/CloudflareR2Plugin"
          cp -a plugin/. "$package_root/CloudflareR2Plugin/"

          # Keep the source tree unchanged; inject the release version only into the archive.
          sed -i "s/@version %version%/@version ${version}/" \
            "$package_root/CloudflareR2Plugin/Plugin.php"
          grep -Fq "@version ${version}" "$package_root/CloudflareR2Plugin/Plugin.php"

          (
            cd "$package_root"
            zip -qr "$archive" CloudflareR2Plugin
          )
          (
            cd "$(dirname "$archive")"
            sha256sum "$(basename "$archive")" > "$(basename "$checksum")"
          )

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "checksum=${checksum}" >> "$GITHUB_OUTPUT"

      - name: Verify archive layout
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          unzip -Z1 "$ARCHIVE" | grep -Fxq "CloudflareR2Plugin/Plugin.php"
          unzip -Z1 "$ARCHIVE" | grep -Fxq "CloudflareR2Plugin/vendor/aws/aws-autoloader.php"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          release_args=(
            "$TAG"
            --target "$GITHUB_SHA"
            --title "CloudflareR2Typecho ${VERSION}"
            --generate-notes
          )

          [[ "$DRAFT" == "true" ]] && release_args+=(--draft)
          [[ "$PRERELEASE" == "true" ]] && release_args+=(--prerelease)

          gh release create "${release_args[@]}" "$ARCHIVE" "$CHECKSUM"
