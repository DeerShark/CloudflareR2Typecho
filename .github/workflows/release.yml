name: Release Plugin

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Get Plugin Name
        id: plugin-name
        run: |
          set -euo pipefail
          php -r '
          $tokens = token_get_all(file_get_contents("./plugin/Plugin.php"));
          $announced = false;
          $namespace = "";
          foreach ($tokens as $token) {
            if (!is_array($token)) {
                continue;
            }
            if (!$announced && $token[0] === T_NAMESPACE) {
                $announced = true;
                continue;
            } elseif ($announced && $token[0] === T_NAME_QUALIFIED) {
                $namespace = $token[1];
                break;
            }
          }
          if (empty($namespace)) {
            echo "Cannot find namespace in Plugin.php";
            exit(1);
          }
          $names = explode("\\", $namespace);
          echo "plugin_name=" . array_pop($names) . PHP_EOL;
          ' >> "$GITHUB_OUTPUT"

      - name: Extract version number
        id: extract-version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          php -r '
          $tag = getenv("RELEASE_TAG");
          if (preg_match("/^v?((?:\d+\.)*\d+)$/", $tag, $matches)) {
            echo "version=" . $matches[1] . PHP_EOL;
          } else {
            fwrite(STDERR, "Cannot extract version number from tag" . PHP_EOL);
            exit(1);
          }' >> "$GITHUB_OUTPUT"

      - name: Zip Plugin
        id: zip-plugin
        run: |
          set -euo pipefail
          plugin_name='${{ steps.plugin-name.outputs.plugin_name }}'
          version='${{ steps.extract-version.outputs.version }}'
          plugin_zip="${plugin_name}-${version}.zip"

          sed -i "s/%version%/${version}/g" ./plugin/Plugin.php
          if grep -q '%version%' ./plugin/Plugin.php; then
            echo 'Version placeholder was not replaced' >&2
            exit 1
          fi

          cp -R -- plugin "$plugin_name"
          zip -rq "$plugin_zip" "$plugin_name"
          echo "plugin_zip=$plugin_zip" >> "$GITHUB_OUTPUT"

      - name: Upload Plugin To Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSET_PATH: ${{ steps.zip-plugin.outputs.plugin_zip }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$ASSET_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
