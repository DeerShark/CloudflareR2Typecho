name: Release Plugin

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的 Git tag，例如 v1.2.3'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GIT_TERMINAL_PROMPT: '0'

    steps:
      - name: Checkout release tag
        run: |
          set -euo pipefail
          : "${RELEASE_TAG:?release_tag is required}"

          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" \
            fetch --depth=1 --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git checkout --detach "refs/tags/${RELEASE_TAG}"

      - name: Check release and tools
        run: |
          set -euo pipefail
          command -v php
          command -v zip
          command -v gh
          php --version
          php -l plugin/Plugin.php
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Build plugin
        id: build
        run: |
          set -euo pipefail

          plugin_name="$(php -r '
          $contents = file_get_contents("./plugin/Plugin.php");
          if ($contents === false || !preg_match("/^\s*namespace\s+([^;]+);/m", $contents, $matches)) {
              fwrite(STDERR, "Cannot find namespace in Plugin.php" . PHP_EOL);
              exit(1);
          }
          $names = explode(chr(92), trim($matches[1]));
          $pluginName = end($names);
          if (!preg_match("/^[A-Za-z_][A-Za-z0-9_]*$/", $pluginName)) {
              fwrite(STDERR, "Invalid plugin name" . PHP_EOL);
              exit(1);
          }
          echo $pluginName;
          ')"

          version="$(php -r '
          $tag = getenv("RELEASE_TAG");
          if (preg_match("/^v?((?:\d+\.)*\d+)$/", $tag, $matches)) {
              echo $matches[1];
              exit(0);
          }
          fwrite(STDERR, "Cannot extract version number from tag" . PHP_EOL);
          exit(1);
          ')"

          plugin_zip="${plugin_name}-${version}.zip"
          sed -i "s/%version%/${version}/g" ./plugin/Plugin.php
          if grep -q '%version%' ./plugin/Plugin.php; then
            echo 'Version placeholder was not replaced' >&2
            exit 1
          fi

          cp -R -- plugin "$plugin_name"
          zip -rq "$plugin_zip" "$plugin_name"
          echo "plugin_zip=$plugin_zip" >> "$GITHUB_OUTPUT"

      - name: Upload plugin to release
        env:
          ASSET_PATH: ${{ steps.build.outputs.plugin_zip }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$ASSET_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
